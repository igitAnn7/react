<!DOCTYPE html>
<html>
  <head>
    <title>chatbot</title>
    <style>
      .send-button{
        background-color : rgb(25,135,84);
        border-color:black ;
        color: white;
        padding: 12px 20px;
        border: none;
        margin-left: 10px;
        border-radius: 10px;
        font-size: 15px;
        cursor: pointer;

      }
      .input-in{
        padding: 12px 15px;
        border-radius: 10px;
        border-width: 1px;
        font-size: 15px;
        flex-grow: 1;
        border-color: black;
      }
      .input-container{
        display: flex;
        margin-bottom: 20px;
      }
      .app-container{
        max-width: 600px;
        margin-left: auto;
        margin-right: auto;
        height: 100vh;;
        display: flex;
        flex-direction: column;
       
      }
      .chat-user{
       display: flex;
       justify-content: right;
      margin-top: 20px;
       align-items: start;
      }
      .chat-robot{
         display: flex;
       justify-content: left;
      margin-top: 20px;
       align-items: start;
      }
      .chat-msg{
        background-color: rgb(238,238,238);
        border-radius: 10px;
        content: center;
        padding: 15px 20px;
        margin-right: 10px;
        margin-left: 10px;
        margin-bottom: 10px;
        max-width: 300px;
       
      }
      body{
        font-family: Arial, Helvetica, sans-serif;
        margin-top: 0px;
        margin-bottom: 0px;
      }
      .chat-msg-container{
        flex-grow: 1;
        margin-top: 20px;
        overflow: scroll;
        scrollbar-width: none;

      }


    </style>
  </head>
  <body>
    <div class="js-container"></div>
 
    <script> src = "basicsjs.js"</script>
    <script src="https://unpkg.com/supersimpledev/react.js"></script>
    <script src="https://unpkg.com/supersimpledev/react-dom.js"></script>
    <script src="https://unpkg.com/supersimpledev/chatbot.js"></script>

    <script src="https://unpkg.com/supersimpledev/babel.js"></script>
    <script type="text/babel">



      function ChatInput({chatMessages,setChatMessages}){
          const [inputText,setInputText]= React.useState('');

          function saveInputText(event){
              setInputText(event.target.value);
            //gives the element that were typing in(FUNNN)
                      }
            function sendMessage(){
              const newChatMessages = [
                 ...chatMessages,
                  //spread operator(create copy of array): uses the current or initial data and updates html with the new data  with it
                  {
                  message: inputText,
                  sender: 'user',
                  id: crypto.randomUUID() 
                  }];
                
              setChatMessages(newChatMessages);

                  const response=Chatbot.getResponse(inputText);
                   setChatMessages([
                   ...newChatMessages,
                  {
                  message: response,
                  sender: 'robot',
                  id: crypto.randomUUID() 
                  }
                  ]);


                  setInputText('');
                      }

        return(
          <div className="input-container">
            <input placeholder = "Send a message to ChatBot" size = "30"
            onChange={saveInputText}
            value={inputText}
            className="input-in"
            />
            <button
            onClick={sendMessage}
            className="send-button"
            >Send</button>
            </div>
          );
      }

function ChatMessage(props){  //props is for properties of the object and make components reusable  
 /*const message = props.message;
 const sender = props.sender;*/ 
 const {message,sender} = props; 

/*
 if(sender == 'robot'){
return(
   <div>
       <img src = "robot.png" width = "50" />
        {message}
      </div>
);
 }*/
  return(
    <div className={sender==='user'?'chat-user':'chat-robot'}>
        {sender == 'robot' && (<img  src = "robot.png" width = "50" />)}<div className="chat-msg">
        {message}
        </div>
        {sender == 'user' && (<img src = "userimg.png" width = "50"/>)}
      
    </div>
  );
}

function ChatMessages({chatMessages}){
  const chatmsgRef=React.useRef(null);
  React.useEffect(() => {
   const containerElem= chatmsgRef.current;
   if(containerElem){
    containerElem.scrollTop=containerElem.scrollHeight;;
   }
  },[chatMessages]);
  return(
    <div className="chat-msg-container" ref={chatmsgRef}>
    { chatMessages.map((chatMessage) => {
      return(
        <ChatMessage
        message={chatMessage.message}
        sender={chatMessage.sender}            
        key= {chatMessage.id}

        // a key component must be given if we make an array to help react keep track of changes in array

        // we dont have to type out each component of input manually if we make a seperate html component which maps every component of the array we put manually

        />
    );
  })}
   </div>
 );
}

function App(){
    const [chatMessages,setChatMessages] = React.useState([{   
    //updating the data willnow update the html too
    message: 'hello chatbot',
    sender: 'user',
    id: 'id1'
  },{
    message: 'hello how can i help you?',
    sender: 'robot',
    id: 'id2'
  }]);

//const [chatMessages,setChatMessages]=array;//shortcut for the 2 lines
//const chatMessages = array[0];
//const setChatMessages=array[1];
//second array function is made to update the data
// cant update react manually.use this function to update data and react will update html
  return(
<div className="app-container">

 
 <ChatMessages 
  chatMessages={chatMessages}
 />
  <ChatInput
    chatMessages={chatMessages}
    setChatMessages={setChatMessages}
  />
</div>
  );
}

      const container = document.querySelector('.js-container');
      ReactDOM.createRoot(container).render(<App />);
    </script>
  </body>
</html>
